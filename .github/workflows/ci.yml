name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/gaps.test.js
      - uses: astral-sh/setup-uv@v6
      - run: uv run --with pytest pytest -q
      - name: cells.json is valid and non-empty
        run: python3 -c "import json; d=json.load(open('data/cells.json')); assert len(d['cells']) > 1000, len(d['cells']); print(len(d['cells']), 'cells from', d['made'])"
